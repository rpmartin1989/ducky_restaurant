<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ducky | Southern Home Cooking</title>
  <meta name="description" content="Ducky — vintage Southern home cooking.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="site-shell">
    <div class="design-wrap">

      <img
        class="design-image"
        src="ducky-homepage.png"
        alt="Ducky Southern Home Cooking restaurant homepage"
      >

      <nav class="hotspots" aria-label="Homepage navigation">

        <a class="hotspot home" href="#top" aria-label="Home"></a>

        <a class="hotspot story" href="our-story.html" aria-label="Our Story"></a>

        <a class="hotspot menu" href="#menu" aria-label="Menu"></a>

        <a
          class="hotspot reservations"
          href="#reserve"
          aria-label="Reservations"
        ></a>

        <a
          class="hotspot find-us"
          href="#visit"
          aria-label="Find Us"
        ></a>

        <a
          class="hotspot reserve-top"
          href="#reserve"
          aria-label="Reserve a Table"
        ></a>

        <a
          class="hotspot view-menu"
          href="#menu"
          aria-label="View Our Menu"
        ></a>

        <a
          class="hotspot story-button"
          href="our-story.html"
          aria-label="Our Story"
        ></a>

        <a
          class="hotspot reserve-bottom"
          href="#reserve"
          aria-label="Reserve a Table"
        ></a>

      </nav>

      <div id="top" class="anchor top-anchor"></div>
      <div id="story" class="anchor story-anchor"></div>
      <div id="menu" class="anchor menu-anchor"></div>
      <div id="reserve" class="anchor reserve-anchor"></div>
      <div id="visit" class="anchor visit-anchor"></div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
